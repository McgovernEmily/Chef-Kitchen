<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meal Finder - Chef Kitchen</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" href="css/mealfinder.css">
    <link rel="stylesheet" href="css/recipe-cards.css">
    <script type="module" src="./js/mealfinder.js"></script>
    <script type="module" src="./js/main.js"></script>
</head>

<body>
    <!-- Header Section -->
    <div id="header-container"></div>

    <!-- Main Content Area -->
    <main class="meal-finder-container">
        <!-- Left Sidebar: Meal Finder Results -->
        <section class="sidebar-results">
            <h2>Meal Finder</h2>

            <div class="search-bar">
                <span class="search-icon" aria-hidden="true">&#128269;</span>
                <input type="text" placeholder="Search recipe..." aria-label="Search recipe">
            </div>

            <div class="filter-controls">
                <select name="category" aria-label="Category">
                    <option value="">Category</option>
                    <option value="Vegetarian">Vegetarian</option>
                    <option value="Vegan">Vegan</option>
                    <option value="Gluten Free">Gluten Free</option>
                    <option value="Dairy Free">Dairy Free</option>
                    <option value="Nut Free">Nut Free</option>
                    <option value="Shellfish Free">Shellfish Free</option>
                    <option value="Soy Free">Soy Free</option>
                    <option value="Egg Free">Egg Free</option>
                    <option value="Low Carb">Low Carb</option>
                    <option value="Keto">Keto</option>
                    <option value="Paleo">Paleo</option>
                    <option value="Whole30">Whole30</option>
                </select>
                <select name="meal-type" aria-label="Meal Type">
                    <option value="">Meal Type</option>
                    <option value="Pasta">Pasta</option>
                    <option value="Soup">Soup</option>
                    <option value="Salad">Salad</option>
                    <option value="Sandwich">Sandwich</option>
                    <option value="Curry">Curry</option>
                    <option value="Beef">Beef</option>
                    <option value="Chicken">Chicken</option>
                    <option value="Pork">Pork</option>
                    <option value="Seafood">Seafood</option>
                    <option value="Lamb">Lamb</option>
                    <option value="Dessert">Dessert</option>
                    <option value="Side">Side</option>
                    <option value="Snack">Snack</option>
                    <option value="Appetizer">Appetizer</option>
                    <option value="Main Course">Main Course</option>
                    <option value="Beverage">Beverage</option>
                </select>
                <select name="country" aria-label="Country">
                    <option value="">Country</option>
                    <option value="British">British</option>
                    <option value="Chinese">Chinese</option>
                    <option value="French">French</option>
                    <option value="Indian">Indian</option>
                    <option value="Italian">Italian</option>
                    <option value="Japanese">Japanese</option>
                    <option value="Spanish">Spanish</option>
                    <option value="American">American</option>
                    <option value="German">German</option>
                </select>
                <button class="clear-filters-button">Clear Filters</button>
                <button class="apply-filters-button">Apply Filters</button>
            </div>

            <div class="recipe-results">
                <h2>Recipes</h2>
                <div class="recipe-cards">
                    <!-- Recipe cards will be dynamically inserted here -->
                </div>
            </div>
        </section>
        <section class="meal-details-container">
            <div class="meal-details-header">
            </div>
            <div class="meal-image">
            </div>
            <div class="meal-details-body">
                <div class="meal-section" id="overview">
                    <button class="overview-button">Overview</button>
                </div>
                <div class="meal-section" id="ingredients">
                    <button class="ingredients-button">Ingredients</button>
                </div>
                <div class="meal-section" id="reviews">
                    <button class="reviews-button">Details</button>
                </div>
            </div>
            <div class="meal-detail-section"></div>
        </section>
    </main>

    <!-- Footer Section -->
    <div id="footer-container"></div>
</body>

</html>
