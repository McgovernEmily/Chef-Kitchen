<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meal Finder - Chef Kitchen</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" href="css/mealfinder.css">
    <link rel="stylesheet" href="css/recipe-cards.css">
    <script type="module" src="/js/mealfinder.js"></script>
</head>

<body>
    <!-- Header Section -->
    <header>
        <h1><img src="chef-kitchen-logo.png" alt="Chef-Kitchen Logo" class="main-logo"></h1>
        <p>Find Meals. Plan Smart. Cook Easy</p>

        <section id="nav">
            <nav class="page-nav">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="mealplanner.html">Meal Planner</a></li>
                    <li><a href="grocerylist.html">Grocery List</a></li>
                    <li><a href="mealfinder.html">Meal Finder</a></li>
                    <li><a href="contact.html">Contact Us</a></li>
                </ul>
            </nav>
        </section>
    </header>

    <!-- Main Content Area -->
    <main class="meal-finder-container">
        <!-- Left Sidebar: Meal Finder Results -->
        <section class="sidebar-results">
            <h2>Meal Finder</h2>

            <div class="search-bar">
                <span class="search-icon" aria-hidden="true">&#128269;</span>
                <input type="text" placeholder="Search recipe..." aria-label="Search recipe">
            </div>

            <div class="filter-controls">
                <select name="category" aria-label="Category">
                    <option value="">Category</option>
                </select>
                <select name="meal-type" aria-label="Meal Type">
                    <option value="">Meal Type</option>
                </select>
                <select name="diet" aria-label="Diet">
                    <option value="">Diet</option>
                </select>
                <select name="sort-by" aria-label="Sort By">
                    <option value="">Sort By</option>
                </select>
                <select name="max-price" aria-label="Max Price">
                    <option value="">Max Price</option>
                </select>
            </div>

            <div class="recipe-results">
                <h2>Recipes</h2>
                <div class="recipe-cards">
                    <!-- Recipe cards will be dynamically inserted here -->
                </div>
            </div>
        </section>
        <section class="meal-details-container">
            <div class="meal-details-header">
            </div>
            <div class="meal-image">
            </div>
            <div class="meal-details-body">
                <div class="meal-section" id="overview">
                    <button class="overview-button">Overview</button>
                </div>
                <div class="meal-section" id="ingredients">
                    <button class="ingredients-button">Ingredients</button>
                </div>
                <div class="meal-section" id="reviews">
                    <button class="reviews-button">Details</button>
                </div>
            </div>
            <div class="meal-detail-section"></div>
        </section>
    </main>

    <!-- Footer Section -->
    <footer>
        <div class="footer-top">
            <h2>Chef-Kitchen</h2>

            <div class="footer-links">
                <a href="#">X</a>
                <a href="#">Facebook</a>
                <a href="#">Instagram</a>
                <a href="#">Pinterest</a>
            </div>
        </div>

        <div class="footer-bottom">
            © 2026 Chef-Kitchen. All Rights Reserved.
        </div>
    </footer>
</body>

</html>
