<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/contact.css">
    <script type="module" src="./js/main.js"></script>
    <script type="module" src="./js/contact.js"></script>
</head>
<body>
    <div id="header-container"></div>

    <div class="container">
        <h1>Contact Us</h1>
        <p>Have questions or feedback? We'd love to hear from you!</p>

        <form class="contact-form">
            <div class="form-group">
                <label for="name" class="visually-hidden" style="position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0;">Your Name</label>
                <input id="name" type="text" placeholder="Your Name" required>
            </div>

            <div class="form-group">
                <label for="phone_number" class="visually-hidden" style="position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0;">Phone Number</label>
                <input type="tel" id="phone_number" placeholder="Phone Number">
            </div>

            <div class="form-group">
                <label for="email" class="visually-hidden" style="position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0;">Your Email</label>
                <input id="email" type="email" placeholder="Your Email" required>
            </div>

            <div class="form-group">
                <label for="message" class="visually-hidden" style="position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0;">Message</label>
                <textarea id="message" placeholder="How can we help..." required></textarea>
                <button type="submit" id="submitbutton">Send Message</button>
            </div>
        </form>
    </div>

    <div id="messageModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalMessage">

        <div class="modal-content">

            <h2 id="modalTitle"></h2>

            <p id="modalMessage"></p>

            <button id="closeModal" class="btn">
                Close
            </button>

        </div>

    </div>

    <div id="footer-container"></div>
</body>
</html>
