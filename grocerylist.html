<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grocery List</title>
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/grocerylist.css">
    <script type="module" src="./js/main.js"></script>
    <script type="module" src="./js/grocerylist.js"></script>
</head>
<body>
    <div id="header-container"></div>

    <div class="container">
        <h1>My Grocery List</h1>

        <div class="grocery-table">
            <table>
                <thead>
                    <tr>
                        <th></th>
                        <th>Ingredient</th>
                        <th>Quantity</th>
                        <th>Meal</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="grocery-body">
                </tbody>
            </table>
        </div>

        <div class="summary">

            <button class="btn">Generate PDF</button>

            <div class="summary-box" id="total-summary"></div>
            
            <button class="btn" id="btn-clear">Clear List</button>

        </div>
    </div>
    <div id="footer-container"></div>
</body>
</html>
